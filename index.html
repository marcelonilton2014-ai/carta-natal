<html lang="pt-BR">
<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Central de Triagem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: uma coluna de celular sobre veludo. No centro, o terminal da central de triagem impresso em papel, como um telegrama. Abaixo, a revelação do dia e o pré-save. Visual único (escuro), por escolha. */
:root {
  --velvet-deep: #1E0507;
  --paper: #EDE3D4;
  --paper-2: #F3EBDF;
  --ink: #2A1A12;
  --ink-soft: #5A4A3E;
  --wine: #8A1120;
  --gold: #C78F39;
  --gold-soft: #E2B66A;
  --muted: #C2B2A2;
  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --hand: 'La Belle Aurore', 'Segoe Script', 'Bradley Hand', cursive;
  color-scheme: dark;
}
html { background: var(--velvet-deep); }
body {
  background: var(--velvet-deep) url(img/veludo.jpg) center top / cover;
  color: var(--paper);
  font-family: var(--mono);
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 480px; margin: 0 auto; padding-block: 24px 44px; display: flex; flex-direction: column; gap: 20px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; }
.bar .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); margin-right: 8px; vertical-align: 1px; }

/* Progresso: 5 lacres */
.seals { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.sealbox { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.sealbox img { width: 100%; max-width: 64px; aspect-ratio: 1; object-fit: contain; filter: grayscale(1) brightness(.45) contrast(.9); opacity: .55; transition: filter .6s ease, opacity .6s ease, transform .6s ease; }
.sealbox.open img { filter: none; opacity: 1; }
.sealbox.today img { opacity: .9; filter: grayscale(.6) brightness(.8); animation: glow 2.2s ease-in-out infinite; }
.sealbox.today.open img { animation: none; filter: none; }
@keyframes glow { 50% { transform: scale(1.06); } }
.sealbox span { font-size: 10px; letter-spacing: .14em; color: var(--muted); }
.sealbox.today span { color: var(--gold-soft); }

/* Terminal em papel */
.term { background: var(--paper-2) url(img/papel.jpg) 0 0 / 290px 200px; color: var(--ink); padding: 22px 20px 20px; position: relative; box-shadow: 0 20px 44px rgba(10,0,2,.55); }
.term::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--wine) 0 18px, transparent 18px 28px, #1E3A24 28px 46px, transparent 46px 56px); opacity: .85; }
.term .head { display: flex; justify-content: space-between; gap: 10px; font-size: 10px; font-weight: 600; letter-spacing: .22em; color: var(--wine); text-transform: uppercase; padding-bottom: 12px; border-bottom: 1.5px dashed #B8AE9F; margin-bottom: 14px; }
.lines { font-size: 14px; line-height: 1.65; min-height: 120px; white-space: pre-wrap; overflow-wrap: anywhere; }
.lines .p { color: var(--wine); font-weight: 600; }
.lines .q { font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.3; color: var(--ink); display: block; margin: 6px 0 2px; white-space: normal; text-wrap: balance; }
.lines .ok { color: #1E5A2E; font-weight: 600; }
.lines .err { color: var(--wine); }
.lines .dim { color: var(--ink-soft); }
.caret { display: inline-block; width: .6em; height: 1.1em; background: var(--ink); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.answer { display: flex; gap: 8px; margin-top: 14px; }
.answer label { position: absolute; left: -9999px; }
.answer input { flex: 1; min-width: 0; min-height: 50px; padding: 0 14px; background: #FFFDF8; color: var(--ink); border: 1.5px solid var(--ink); font-family: var(--mono); font-size: 16px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.rename { align-self: center; background: none; border: 0; color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-decoration: underline; cursor: pointer; padding: 6px; }
.rename:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 3px; }
.answer input::placeholder { color: #9A8E80; letter-spacing: .08em; }
.answer button { min-height: 50px; padding: 0 16px; border: 0; background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
.hintbtn { margin-top: 10px; background: none; border: 0; padding: 4px 0; color: var(--wine); font-family: var(--mono); font-size: 12px; text-decoration: underline; cursor: pointer; }
.term.shake { animation: tshake .4s ease; }
@keyframes tshake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* Revelação */
.reveal { display: flex; flex-direction: column; gap: 14px; animation: rise .6s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.reveal .kicker { font-size: 11px; font-weight: 600; letter-spacing: .26em; color: var(--gold-soft); text-transform: uppercase; }
.reveal h2 { font-family: var(--display); font-weight: 400; font-style: italic; font-size: clamp(30px, 8.5vw, 40px); line-height: 1.08; margin: 0; text-wrap: balance; }
.reveal p { margin: 0; font-size: 14px; line-height: 1.6; }
.names { list-style: none; margin: 0; padding: 16px 18px; background: rgba(20,2,4,.45); border: 1px solid rgba(199,143,57,.45); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.names li { font-family: var(--hand); font-size: 22px; line-height: 1.3; }
.names li:last-child:nth-child(odd) { grid-column: 1 / -1; }
.pic { display: block; width: 100%; height: auto; box-shadow: 0 18px 40px rgba(10,0,2,.55); }
.postal { background: var(--paper-2) url(img/papel.jpg) 0 0 / 290px 200px; padding: 10px 10px 0; transform: rotate(-1.5deg); box-shadow: 0 18px 40px rgba(10,0,2,.55); }
.postal img { display: block; width: 100%; height: auto; }
.postal .cap { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 4px; color: var(--ink); }
.postal .cap .h { font-family: var(--hand); font-size: 20px; }
.postal .cap .m { font-size: 9px; letter-spacing: .2em; color: var(--wine); text-transform: uppercase; white-space: nowrap; }
.lyric { background: var(--paper-2) url(img/papel.jpg) 0 0 / 290px 200px; color: var(--ink); padding: 22px 20px; font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1.5; white-space: pre-line; text-align: center; box-shadow: 0 18px 40px rgba(10,0,2,.55); }
.free { background: rgba(20,2,4,.5); border: 1px solid var(--gold); padding: 18px; display: flex; flex-direction: column; gap: 12px; }

.btn { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 54px; padding: 14px 20px; border: 0; cursor: pointer; text-decoration: none; font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; transition: transform .15s ease, background .2s ease; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--gold); color: var(--velvet-deep); }
.btn-primary:hover { background: var(--gold-soft); }
.btn-ghost { background: transparent; color: var(--paper); border: 1.5px solid rgba(237,227,212,.6); }
.fine { font-size: 12px; line-height: 1.6; color: var(--muted); margin: 0; }
.next { border-top: 1px solid rgba(199,143,57,.5); border-bottom: 1px solid rgba(199,143,57,.5); padding: 14px 0; display: flex; flex-direction: column; gap: 4px; }
.next .k { font-size: 10px; font-weight: 600; letter-spacing: .26em; color: var(--gold-soft); text-transform: uppercase; }
.next .v { font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1.25; }
.past summary { cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); padding: 10px 0; }
.past .inner { display: flex; flex-direction: column; gap: 22px; padding-top: 10px; }
.answer input:focus-visible, .answer button:focus-visible, .btn:focus-visible, .hintbtn:focus-visible, .testbar button:focus-visible, .past summary:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 3px; }
.footer { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 10px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
.footer .chip { background: var(--paper); padding: 6px 10px; display: flex; }
.footer .chip img { width: 44px; height: auto; display: block; }
.testbar { background: var(--paper); color: var(--ink); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; }
.testbar button { font-family: var(--mono); font-size: 11px; padding: 6px 8px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.testbar button[aria-pressed="true"] { background: var(--wine); color: var(--paper); border-color: var(--wine); }
/* Dia 14: escolher um remetente */
.chooser { display: flex; flex-direction: column; gap: 14px; background: rgba(20,2,4,.45); border: 1px solid rgba(199,143,57,.5); padding: 18px 14px; }
.chooser .ask { font-family: var(--display); font-style: italic; font-size: 24px; line-height: 1.2; text-align: center; text-wrap: balance; margin: 0; }
.chooser .sub { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
.acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 10px; }
.act { width: calc(25% - 8px); min-width: 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0; color: var(--paper); cursor: pointer; font-family: var(--mono); }
.act .av { width: 66px; height: 66px; border-radius: 50%; overflow: hidden; display: flex; border: 2px solid rgba(199,143,57,.7); box-shadow: 0 6px 14px rgba(0,0,0,.4); transition: transform .2s ease, border-color .2s ease; }
.act .av img { flex: 1; min-width: 0; height: 100%; object-fit: cover; display: block; }
.act .av img + img { border-left: 2px solid var(--velvet-deep); }
.act .nm { font-size: 10px; line-height: 1.3; letter-spacing: .06em; text-align: center; }
.act:hover .av { transform: translateY(-2px); border-color: var(--gold-soft); }
.act[aria-pressed="true"] .av { border-color: var(--gold-soft); box-shadow: 0 0 0 3px rgba(226,182,106,.35); }
.act.locked { opacity: .35; cursor: not-allowed; }
.act.locked .av { filter: grayscale(1); }
.act:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 3px; border-radius: 8px; }
.player { position: relative; width: 100%; max-width: 300px; aspect-ratio: 9 / 16; margin: 0 auto; background: #120204; overflow: hidden; box-shadow: 0 18px 40px rgba(10,0,2,.6); }
.player video { width: 100%; height: 100%; object-fit: cover; display: block; }
.player .bg { position: absolute; inset: 0; display: flex; filter: blur(14px) brightness(.55); transform: scale(1.15); }
.player .bg img { flex: 1; min-width: 0; object-fit: cover; }
.player .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
.player .ph .av { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; display: flex; border: 2px solid var(--gold-soft); }
.player .ph .av img { flex: 1; min-width: 0; object-fit: cover; }
.player .ph p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--paper); }
.player .ph .play { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--gold); color: var(--velvet-deep); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.player .tag { position: absolute; left: 12px; top: 12px; background: var(--paper); color: var(--ink); padding: 5px 10px; font-family: var(--hand); font-size: 18px; z-index: 2; box-shadow: 0 3px 8px rgba(0,0,0,.35); transform: rotate(-2deg); }
.player .bar2 { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--gold); width: 0; z-index: 2; }
.after { display: flex; flex-direction: column; gap: 10px; }
.after .fine { text-align: center; }
@media (prefers-reduced-motion: reduce) {
  .caret, .sealbox.today img, .reveal, .term.shake { animation: none; }
}
</style>

</head>
<body>
<div class="wrap">
  <div class="testbar" id="testbar" hidden>
    <strong>Teste · simular dia:</strong>
    <span id="testdays" style="display:flex;flex-wrap:wrap;gap:6px"></span>
  </div>

  <div class="bar">
    <div><span class="dot" aria-hidden="true"></span>Central de triagem</div>
    <div id="bar-right">Lacre 1 de 5</div>
  </div>

  <div class="seals" id="seals" aria-label="Progresso dos lacres"></div>

  <section class="term" id="term" aria-label="Terminal da central de triagem">
    <div class="head"><span>Correio de Natal</span><span id="obj">Objeto VJ1711</span></div>
    <div class="lines" id="lines" aria-live="polite"></div>
    <form class="answer" id="nameform" hidden>
      <label for="nm-in">Seu nome</label>
      <input id="nm-in" name="nome" type="text" maxlength="20" autocomplete="given-name" spellcheck="false" placeholder="seu primeiro nome">
      <button type="submit">Continuar</button>
    </form>
    <form class="answer" id="answer" hidden>
      <label for="ans">Sua resposta</label>
      <input id="ans" name="resposta" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="sua resposta">
      <button type="submit">Abrir lacre</button>
    </form>
    <button class="hintbtn" id="hintbtn" type="button" hidden>Pedir uma dica</button>
  </section>

  <div id="reveal-slot"></div>

  <button class="rename" id="rename" type="button" hidden>Não é você? Trocar nome</button>

  <details class="past" id="past" hidden>
    <summary>Lacres já abertos</summary>
    <div class="inner" id="past-inner"></div>
  </details>

  <div class="footer">
    <span class="chip"><img src="img/logo_gba.webp" alt="GBA Music"></span>
    <span>Viva Jesus · 17 · XI</span>
  </div>
</div>

<script>
/* ===== CONFIGURAÇÃO ===== */
var CONFIG = {
  presaveUrl: 'https://SEU-LINK-DE-PRE-SAVE',
  listenUrl: 'https://SEU-SMARTLINK',
  teaserUrl: 'https://SEU-LINK-DO-REELS-DO-REFRAO',   // dia 15: trecho do refrão
  bonusUrl: 'https://SEU-LINK-DO-AUDIO-DE-BASTIDOR',  // dia 16: conteúdo exclusivo
  siteUrl: 'https://SEU-SITE/central/',
  artist16: 'Ramon e Rafael',                          // quem esconde a pista do dia 16
  launchDate: '2026-11-17'
};
/* Respostas embaralhadas (texto invertido em base64). Dia 16: troque pela resposta real. */
var DAYS = [
  { d: '2026-11-12', label: '12/11', q: 'Cidade cujo nome quer dizer “casa do pão”.', k: 'TUVMRUI=', hint: 'Fica na Judeia. Foi lá que Jesus nasceu.', reveal: 'names', next: 'o nome desta carta.' },
  { d: '2026-11-13', label: '13/11', q: 'Nome que significa “Deus conosco”.', k: 'TEVVTkFNRQ==', hint: 'Está em Mateus 1,23. Começa com E.', reveal: 'capa', next: 'uma foto que ninguém viu.' },
  { d: '2026-11-14', label: '14/11', q: 'O que guiou os Magos até o Menino?', k: 'QUxFUlRTRQ==', hint: 'Brilhou no céu do Oriente. Está no lacre desta carta.', reveal: 'foto', next: 'as primeiras palavras da carta.' },
  { d: '2026-11-15', label: '15/11', q: '“E o Verbo se fez ____ e habitou entre nós.” (Jo 1,14)', k: 'RU5SQUM=', hint: 'Cinco letras. Deus se fez gente como a gente.', reveal: 'letra', next: 'a última chave. Ela está com os artistas.' },
  { d: '2026-11-16', label: '16/11', q: null, k: 'QUlSQU0=', hint: null, reveal: 'liberada', next: 'à meia-noite, a carta chega.' }
];
DAYS[4].q = 'Nos Stories de ' + CONFIG.artist16 + ' tem um envelope escrito à mão. Para quem é?';
DAYS[4].hint = 'Abra o perfil de ' + CONFIG.artist16 + ' e veja os Stories de hoje. O nome está depois de “Para:”.';
var ARTISTS = ['Danúbia', 'Davidson Silva', 'Fátima Souza', 'Flávio Vitor Jr.', 'GBA Worship', 'Ramon e Rafael', 'Um Peregrino'];
/* Dia 14: um vídeo por remetente. Coloque o arquivo .mp4 em img/videos/ e o caminho em "video". Vazio = tela de exemplo. */
var ACTS = [
  { id: 'danubia', name: 'Danúbia', faces: ['danubia'], video: '' },
  { id: 'davidson', name: 'Davidson Silva', faces: ['davidson'], video: '' },
  { id: 'fatima', name: 'Fátima Souza', faces: ['fatima'], video: '' },
  { id: 'flavio', name: 'Flávio Vitor Jr.', faces: ['flavio'], video: '' },
  { id: 'gbaworship', name: 'GBA Worship', faces: ['jessica', 'herrison'], video: '' },
  { id: 'ramonrafael', name: 'Ramon e Rafael', faces: ['ramon', 'rafael'], video: '' },
  { id: 'peregrino', name: 'Um Peregrino', faces: ['peregrino'], video: '' }
];

function $(id) { return document.getElementById(id); }
var params = new URLSearchParams(location.search);
var hash = (location.hash || '').replace('#', '');
var testMode = params.get('teste') === '1' || hash === 'teste' || CONFIG.siteUrl.indexOf('SEU-SITE') >= 0;
var overrideDate = params.get('data') || null;
function todaySP() { try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } }
if (testMode && !overrideDate && todaySP() < DAYS[0].d) overrideDate = DAYS[0].d;
function today() { return overrideDate || todaySP(); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function norm(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function key(w) { try { return btoa(w.split('').reverse().join('')); } catch (e) { return ''; } }
function matches(input, k) { var words = norm(input).split(' '); var all = norm(input).replace(/ /g, ''); return words.some(function (w) { return key(w) === k; }) || key(all) === k; }
function cleanName(s) { return (s || '').replace(/[^\p{L}\p{M}' -]/gu, '').trim().split(' ')[0].slice(0, 20); }
var nome = cleanName(params.get('nome'));
if (nome) store('vj-nome', nome); else nome = cleanName(store('vj-nome'));
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function todayIndex() { var t = today(), n = -1; DAYS.forEach(function (d, i) { if (d.d <= t) n = i; }); return n; } // -1 antes de 12/11
function launched() { return today() >= CONFIG.launchDate; }
function solved(i) { return store('vj-lacre-' + DAYS[i].d) === '1'; }

/* ===== Datilografia ===== */
var typing = null;
function type(parts, done) {
  var box = $('lines'); box.textContent = '';
  if (typing) clearTimeout(typing);
  var caret = document.createElement('span'); caret.className = 'caret'; caret.setAttribute('aria-hidden', 'true');
  var i = 0;
  function nextPart() {
    if (i >= parts.length) { box.appendChild(caret); if (done) done(); return; }
    var p = parts[i++];
    var el = document.createElement('span'); if (p.c) el.className = p.c;
    box.appendChild(el);
    var text = p.t + (p.c === 'q' ? '' : '\n');
    if (reduce) { el.textContent = text; nextPart(); return; }
    var j = 0;
    (function step() {
      el.textContent = text.slice(0, ++j);
      if (j < text.length) typing = setTimeout(step, p.c === 'q' ? 22 : 14);
      else typing = setTimeout(nextPart, 160);
    })();
  }
  nextPart();
}

/* ===== Revelações ===== */
function revealNode(kind) {
  var w = document.createElement('section'); w.className = 'reveal';
  var html = '';
  if (kind === 'names') {
    html = '<div class="kicker">Lacre 1 · aberto</div><h2>Estes são os remetentes.</h2><p>Sete artistas escreveram esta carta à mão. Ainda falta descobrir o que tem dentro.</p><ul class="names">' + ARTISTS.map(function (a) { return '<li>' + a + '</li>'; }).join('') + '</ul>';
  } else if (kind === 'capa') {
    html = '<div class="kicker">Lacre 2 · aberto</div><h2>A carta tem nome.</h2><img class="pic" src="img/capa.jpg" alt="Capa do single Viva Jesus" width="800" height="800"><p>Viva Jesus. Uma música de Natal na voz dos sete remetentes, que chega no dia 17.</p>';
  } else if (kind === 'foto') {
    html = '<div class="kicker">Lacre 3 · aberto</div><h2>Uma foto que ninguém viu.</h2><div class="postal"><img src="img/artistas.jpg" alt="Os 7 artistas de Viva Jesus reunidos numa sala decorada para o Natal" width="1100" height="700"><div class="cap"><span class="h">com carinho, os remetentes</span><span class="m">Belém · 17 XI</span></div></div>';
  } else if (kind === 'letra') {
    html = '<div class="kicker">Lacre 4 · aberto</div><h2>As primeiras palavras.</h2><div class="lyric">É mais um Natal\npois o Verbo entre a gente viveu.\nÉ mais um Natal,\no Deus menino nasceu.</div><a class="btn btn-ghost" href="' + CONFIG.teaserUrl + '" target="_blank" rel="noopener">Ouvir o trecho do refrão</a>';
  } else if (kind === 'liberada') {
    html = '<div class="kicker">Lacre 5 · aberto</div><h2>Carta liberada.</h2><div class="free"><p>Você abriu os cinco lacres. Como presente, um áudio dos bastidores que ainda não saiu em lugar nenhum.</p><a class="btn btn-ghost" href="' + CONFIG.bonusUrl + '" target="_blank" rel="noopener">Ouvir o áudio de bastidor</a></div><p>À meia-noite, Viva Jesus chega para todo mundo. Quem guardou a carta recebe primeiro.</p>';
  }
  w.innerHTML = html;
  if (kind === 'foto') w.appendChild(buildChooser());
  return w;
}

/* ===== Dia 14: escolha um remetente ===== */
function faces(a) { return a.faces.map(function (f) { return '<img src="img/a/' + f + '.jpg" alt="">'; }).join(''); }
function buildChooser() {
  var box = document.createElement('div'); box.className = 'chooser';
  box.innerHTML = '<p class="ask">Escolha um dos remetentes para te mandar uma mensagem.</p><p class="sub">Depois da primeira mensagem, os outros também ficam disponíveis.</p><div class="acts"></div><div class="stagearea"></div>';
  var acts = box.querySelector('.acts'), area = box.querySelector('.stagearea');
  function unlocked() { return store('vj-outros') === '1'; }
  function chosen() { return store('vj-escolha'); }
  function drawButtons() {
    acts.textContent = '';
    ACTS.forEach(function (a) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'act';
      var locked = chosen() && !unlocked() && chosen() !== a.id;
      if (locked) b.classList.add('locked');
      b.setAttribute('aria-pressed', String(chosen() === a.id));
      b.setAttribute('aria-label', a.name + (locked ? ' (libera depois da primeira mensagem)' : ''));
      b.innerHTML = '<span class="av">' + faces(a) + '</span><span class="nm"></span>';
      b.querySelector('.nm').textContent = a.name;
      b.addEventListener('click', function () { if (!locked) play(a); });
      acts.appendChild(b);
    });
  }
  function play(a) {
    if (!chosen()) store('vj-escolha', a.id);
    drawButtons();
    area.textContent = '';
    var p = document.createElement('div'); p.className = 'player';
    var tag = '<span class="tag">Para: ' + (nome ? nome : 'você').replace(/[<>&"]/g, '') + '</span>';
    if (a.video) {
      p.innerHTML = tag + '<video playsinline controls autoplay preload="metadata"></video>';
      var v = p.querySelector('video'); v.src = a.video; v.setAttribute('aria-label', 'Mensagem de ' + a.name);
      v.addEventListener('ended', function () { finish(a); });
    } else {
      p.innerHTML = tag + '<div class="bg">' + faces(a) + '</div><div class="ph"><span class="av">' + faces(a) + '</span><p></p><button class="play" type="button" aria-label="Tocar mensagem"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M6 3 L19 11 L6 19 Z" fill="currentColor"></path></svg></button></div><span class="bar2"></span>';
      p.querySelector('p').textContent = 'Aqui entra o vídeo de ' + a.name + ' falando com você (20 a 30 s, vertical).';
      var playBtn = p.querySelector('.play');
      playBtn.addEventListener('click', function () {
        playBtn.disabled = true; playBtn.style.opacity = '.4';
        var bar = p.querySelector('.bar2'), t0 = null, dur = 3500;
        (function step(ts) { if (!t0) t0 = ts; var k = Math.min(1, (ts - t0) / dur); bar.style.width = (k * 100) + '%'; if (k < 1) requestAnimationFrame(step); else finish(a); })(performance.now());
      });
    }
    area.appendChild(p);
    if (!reduce) setTimeout(function () { p.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
  }
  function finish(a) {
    var first = !unlocked();
    store('vj-outros', '1');
    drawButtons();
    var old = area.querySelector('.after'); if (old) old.remove();
    var af = document.createElement('div'); af.className = 'after';
    af.innerHTML = '<p class="fine"></p>';
    af.querySelector('.fine').textContent = first ? 'Os outros remetentes também deixaram uma mensagem para você. Toque em outro rosto acima.' : 'Toque em outro rosto acima para ouvir mais um remetente.';
    area.appendChild(af);
  }
  drawButtons();
  return box;
}
function ctaNode(i) {
  var f = document.createDocumentFragment();
  var a = document.createElement('a'); a.className = 'btn btn-primary'; a.target = '_blank'; a.rel = 'noopener'; a.href = CONFIG.presaveUrl;
  a.textContent = i === 0 ? 'Quero ver a capa primeiro' : 'Guardar minha carta';
  var p = document.createElement('p'); p.className = 'fine';
  p.textContent = i === 0 ? 'No link do pré-save você vê a capa antes de todo mundo e já guarda a música para o dia 17.' : 'Salve agora e, no dia 17, a música aparece sozinha na sua biblioteca.';
  f.appendChild(a); f.appendChild(p);
  return f;
}
function nextNode(i) {
  var n = document.createElement('div'); n.className = 'next';
  var d = DAYS[i + 1];
  n.innerHTML = '<span class="k">' + (d ? 'Amanhã · ' + d.label + ' · 00h' : 'Hoje · 00h') + '</span><span class="v"></span>';
  n.querySelector('.v').textContent = d ? 'Novo lacre: ' + DAYS[i].next : 'À meia-noite, a carta chega para todo mundo.';
  return n;
}

/* ===== Montagem da tela ===== */
var wrong = 0;
function renderSeals(idx) {
  var box = $('seals'); box.textContent = '';
  DAYS.forEach(function (d, i) {
    var open = launched() || (i < idx) || (i === idx && solved(i));
    var div = document.createElement('div');
    div.className = 'sealbox' + (open ? ' open' : '') + (i === idx && !launched() ? ' today' : '');
    div.innerHTML = '<img src="img/lacre.webp" alt=""><span>' + d.label + '</span>';
    div.setAttribute('aria-label', 'Lacre ' + (i + 1) + ', ' + d.label + ', ' + (open ? 'aberto' : 'fechado'));
    box.appendChild(div);
  });
}
function renderPast(idx) {
  var upto = launched() ? DAYS.length : idx;
  var inner = $('past-inner'); inner.textContent = '';
  for (var i = 0; i < upto; i++) inner.appendChild(revealNode(DAYS[i].reveal));
  $('past').hidden = upto <= 0;
}
function render() {
  var idx = todayIndex();
  wrong = 0; $('hintbtn').hidden = true; $('answer').hidden = true; $('nameform').hidden = true; $('reveal-slot').textContent = '';
  $('rename').hidden = !nome;
  if (!nome) {
    renderSeals(idx); $('past').hidden = true;
    $('bar-right').textContent = 'Identificação';
    type([{ t: '> buscando objeto VJ1711...', c: 'dim' }, { t: '> carta de Natal encontrada.', c: 'ok' }, { t: '> falta o nome do destinatário.', c: 'p' }, { t: 'Para quem é esta carta?', c: 'q' }], function () { $('nameform').hidden = false; $('nm-in').value = ''; });
    return;
  }
  $('term').classList.remove('shake');
  var who = nome ? 'para: ' + nome.toUpperCase() : 'para: você';
  renderSeals(idx); renderPast(idx);

  if (launched()) {
    $('bar-right').textContent = 'Entregue';
    type([{ t: '> objeto VJ1711 · ' + who, c: 'dim' }, { t: '> 5 de 5 lacres abertos.', c: 'ok' }, { t: '> status: ENTREGUE.', c: 'ok' }, { t: 'Viva Jesus chegou. Agora é a sua vez de mandar para alguém.', c: 'q' }]);
    var r = document.createElement('section'); r.className = 'reveal';
    r.innerHTML = '<div class="kicker">17 · XI</div><h2>A carta chegou.</h2><img class="pic" src="img/capa.jpg" alt="Capa do single Viva Jesus" width="800" height="800">';
    var a = document.createElement('a'); a.className = 'btn btn-primary'; a.href = CONFIG.listenUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Ouvir agora';
    r.appendChild(a); $('reveal-slot').appendChild(r);
    return;
  }
  if (idx < 0) {
    $('bar-right').textContent = 'Abre 12/11';
    type([{ t: '> central de triagem em preparação.', c: 'dim' }, { t: '> primeiro lacre disponível em 12/11 · 00h.', c: 'p' }]);
    return;
  }
  $('bar-right').textContent = 'Lacre ' + (idx + 1) + ' de 5';
  var d = DAYS[idx];
  if (solved(idx)) { showSolved(idx, false); return; }
  var intro = idx === 0
    ? [{ t: '> buscando objeto VJ1711...', c: 'dim' }, { t: '> ' + who, c: 'dim' }, { t: '> ERRO: carta retida na central.', c: 'err' }, { t: '> 5 lacres bloqueados. um abre por dia.', c: 'p' }, { t: '> LACRE 1 · charada do dia:', c: 'p' }]
    : [{ t: '> objeto VJ1711 · ' + who, c: 'dim' }, { t: '> ' + idx + ' de 5 lacres abertos.', c: 'ok' }, { t: '> LACRE ' + (idx + 1) + ' · charada do dia:', c: 'p' }];
  intro.push({ t: d.q, c: 'q' });
  type(intro, function () { $('answer').hidden = false; $('ans').value = ''; });
}
function showSolved(idx, fresh) {
  var d = DAYS[idx];
  var lines = [{ t: '> LACRE ' + (idx + 1) + ' aberto.', c: 'ok' }, { t: '> ' + (idx + 1) + ' de 5 lacres abertos.', c: 'ok' }];
  if (DAYS[idx + 1]) lines.push({ t: '> próximo lacre: ' + DAYS[idx + 1].label + ' · 00h.', c: 'p' });
  else lines.push({ t: '> carta liberada. entrega: hoje, 00h.', c: 'p' });
  type(lines);
  renderSeals(idx);
  var slot = $('reveal-slot'); slot.textContent = '';
  slot.appendChild(revealNode(d.reveal));
  slot.appendChild(ctaNode(idx));
  slot.appendChild(nextNode(idx));
  if (fresh && !reduce) setTimeout(function () { slot.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 900);
}

$('nameform').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = cleanName($('nm-in').value);
  if (!v) { $('nm-in').focus(); return; }
  nome = v; store('vj-nome', v); render();
});
$('rename').addEventListener('click', function () { nome = ''; store('vj-nome', ''); render(); setTimeout(function () { $('nm-in').focus(); }, 50); });
$('answer').addEventListener('submit', function (e) {
  e.preventDefault();
  var idx = todayIndex(); if (idx < 0) return;
  var v = $('ans').value;
  if (!norm(v)) { $('ans').focus(); return; }
  if (matches(v, DAYS[idx].k)) {
    store('vj-lacre-' + DAYS[idx].d, '1');
    $('answer').hidden = true; $('hintbtn').hidden = true;
    if (navigator.vibrate) { try { navigator.vibrate([30, 40, 60]); } catch (er) {} }
    showSolved(idx, true);
  } else {
    wrong++;
    var t = $('term'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
    var line = document.createElement('span'); line.className = 'err'; line.textContent = '\n> "' + norm(v) + '" não abre este lacre. tente de novo.';
    $('lines').insertBefore(line, $('lines').querySelector('.caret'));
    if (wrong >= 2) $('hintbtn').hidden = false;
    $('ans').select();
  }
});
$('hintbtn').addEventListener('click', function () {
  var idx = todayIndex();
  var line = document.createElement('span'); line.className = 'dim'; line.textContent = '\n> dica: ' + DAYS[idx].hint;
  $('lines').insertBefore(line, $('lines').querySelector('.caret'));
  $('hintbtn').hidden = true; $('ans').focus();
});

function renderTestbar() {
  if (!testMode) return;
  $('testbar').hidden = false;
  var box = $('testdays'); box.textContent = '';
  DAYS.map(function (d) { return [d.d, d.label]; }).concat([['2026-11-17', '17/11']]).forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = p[1];
    b.setAttribute('aria-pressed', String(today() === p[0]));
    b.addEventListener('click', function () { overrideDate = p[0]; render(); renderTestbar(); });
    box.appendChild(b);
  });
  var z = document.createElement('button'); z.type = 'button'; z.textContent = 'Zerar';
  z.addEventListener('click', function () { DAYS.forEach(function (d) { try { localStorage.removeItem('vj-lacre-' + d.d); } catch (e) {} }); try { localStorage.removeItem('vj-escolha'); localStorage.removeItem('vj-outros'); localStorage.removeItem('vj-nome'); } catch (e) {} nome = cleanName(params.get('nome')); render(); });
  box.appendChild(z);
}

render();
renderTestbar();
</script>

</body>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A nossa casa está de portas abertas para você e sua família. Tem uma carta esperando por você.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://marcelonilton2014-ai.github.io/carta-natal/">
<meta property="og:title" content="Portas Abertas · Viva Jesus">
<meta property="og:description" content="A nossa casa está de portas abertas para você e sua família. Tem uma carta esperando por você.">
<meta property="og:image" content="https://marcelonilton2014-ai.github.io/carta-natal/img/capa.jpg">
<style>*{box-sizing:border-box}body{margin:0}</style>
<title>Portas Abertas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=La+Belle+Aurore&display=swap">
<style>
/* Layout: uma coluna de celular. Na entrada, uma porta natalina que se abre. Dentro, 4 selos de progresso, a carta datilografada com a charada do dia e a revelação.
   IDENTIDADE PROVISÓRIA: troque as cores e fontes abaixo quando a identidade nova chegar. Visual único (escuro), por escolha. */
:root {
  --wall: #1E0507;          /* fundo da casa */
  --door: #7A1420;          /* porta */
  --door-dark: #5A0D17;
  --frame: #C78F39;         /* batente e detalhes dourados */
  --light: #FFD98A;         /* luz de dentro da casa */
  --paper: #EDE3D4;
  --paper-2: #F3EBDF;
  --ink: #2A1A12;
  --ink-soft: #5A4A3E;
  --wine: #8A1120;
  --pine: #1F4A2A;
  --gold: #C78F39;
  --gold-soft: #E2B66A;
  --muted: #C2B2A2;
  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --hand: 'La Belle Aurore', 'Segoe Script', 'Bradley Hand', cursive;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: var(--wall); }
body {
  background: var(--wall) url(img/veludo.jpg) center top / cover;
  color: var(--paper);
  font-family: var(--mono);
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.locked { overflow: hidden; }
.wrap { max-width: 480px; margin: 0 auto; padding-block: 24px 44px; display: flex; flex-direction: column; gap: 20px; }

/* ===== Entrada: a porta ===== */
.intro { position: fixed; inset: 0; z-index: 20; background: radial-gradient(ellipse at 50% 40%, #3A0A10 0%, var(--wall) 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); text-align: center; transition: opacity .7s ease .9s; }
.intro.gone { opacity: 0; pointer-events: none; }
.intro .kick { font-size: 11px; font-weight: 600; letter-spacing: .32em; color: var(--gold-soft); text-transform: uppercase; }
.intro h1 { font-family: var(--display); font-weight: 400; font-style: italic; font-size: clamp(30px, 8.4vw, 42px); line-height: 1.1; margin: 0; max-width: 420px; text-wrap: balance; }
.house { position: relative; width: min(62vw, 270px); aspect-ratio: 5 / 8.4; perspective: 1100px; }
.house .glow { position: absolute; inset: 6% 7% 0; background: radial-gradient(ellipse at 50% 60%, var(--light) 0%, #F2A94A 35%, #8A3A12 75%, #2A0A06 100%); }
.house .frame { position: absolute; inset: 0; border: 12px solid var(--frame); border-bottom: 0; border-radius: 50% 50% 0 0 / 22% 22% 0 0; box-shadow: inset 0 0 0 3px #8A6224, 0 18px 40px rgba(0,0,0,.6); pointer-events: none; z-index: 3; }
.door { position: absolute; inset: 6% 7% 0; background: linear-gradient(90deg, var(--door-dark) 0%, var(--door) 18%, var(--door) 82%, var(--door-dark) 100%); border-radius: 50% 50% 0 0 / 18% 18% 0 0; transform-origin: 0 50%; transition: transform 1.3s cubic-bezier(.6,0,.2,1); z-index: 2; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
.door .panel { position: absolute; left: 14%; right: 14%; border: 3px solid rgba(0,0,0,.28); box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); border-radius: 4px; }
.door .p1 { top: 14%; height: 34%; border-radius: 50% 50% 4px 4px / 22% 22% 4px 4px; }
.door .p2 { top: 54%; height: 38%; }
.door .knob { position: absolute; right: 11%; top: 56%; width: 7%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE6A6, var(--gold) 60%, #7A5418); box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.door .wreath { position: absolute; left: 50%; top: 20%; width: 46%; transform: translateX(-50%); }
.intro.open .door { transform: rotateY(-108deg); }
.intro.open .house { animation: walkin 1.2s ease-in .8s both; }
@keyframes walkin { to { transform: scale(2.6); opacity: 0; } }
.enter { min-height: 54px; padding: 0 34px; border: 0; background: var(--gold); color: var(--wall); font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; cursor: pointer; }
.enter:hover { background: var(--gold-soft); }
.intro p.sub { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 340px; }

/* ===== Casa: nome e cafezinho ===== */
.home { position: fixed; inset: 0; z-index: 19; overflow-y: auto; background: radial-gradient(ellipse at 50% 30%, #4A1A10 0%, #2A0A08 55%, var(--wall) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); text-align: center; animation: fadein .8s ease both; transition: opacity .6s ease; }
.home.gone { opacity: 0; pointer-events: none; }
@keyframes fadein { from { opacity: 0; } }
.home .kick { font-size: 11px; font-weight: 600; letter-spacing: .32em; color: var(--gold-soft); text-transform: uppercase; }
.home h1 { font-family: var(--display); font-weight: 400; font-style: italic; font-size: clamp(30px, 8.4vw, 42px); line-height: 1.1; margin: 0; max-width: 420px; text-wrap: balance; }
.home .sub { margin: 0; font-size: 14px; line-height: 1.65; color: var(--muted); max-width: 340px; }
.home .answer { width: 100%; max-width: 360px; margin-top: 4px; }
.home .answer input { border-color: var(--gold); }
.home .answer button { background: var(--gold); color: var(--wall); }
.table { position: relative; width: min(84vw, 340px); height: 190px; }
.table::after { content: ""; position: absolute; left: -6%; right: -6%; bottom: 0; height: 26px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,200,120,.22), transparent 70%); }
.env { position: absolute; left: 0; bottom: 18px; width: 62%; aspect-ratio: 3 / 2; background: var(--paper-2) url(img/papel.jpg) 0 0 / 220px 150px; transform: rotate(-6deg); box-shadow: 0 14px 28px rgba(0,0,0,.55); overflow: hidden; }
.env::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom right, transparent 49.4%, rgba(90,60,40,.25) 50%, transparent 50.6%), linear-gradient(to bottom left, transparent 49.4%, rgba(90,60,40,.25) 50%, transparent 50.6%); background-size: 100% 120%; background-repeat: no-repeat; }
.env .seal { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -38%); border-radius: 50%; background: radial-gradient(circle at 38% 35%, #C23040, var(--wine) 60%, #4A0810); box-shadow: 0 3px 6px rgba(0,0,0,.4); }
.env .to { position: absolute; left: 9%; bottom: 9%; font-family: var(--hand); font-size: 20px; color: var(--ink); white-space: nowrap; }
.env .stp { position: absolute; right: 7%; top: 8%; width: 16%; aspect-ratio: 4 / 5; border: 2px dashed rgba(138,17,32,.5); }
.cup { position: absolute; right: 2%; bottom: 10px; width: 38%; }
.steam path { animation: steam 3.2s ease-in-out infinite; opacity: 0; }
.steam path:nth-child(2) { animation-delay: 1s; }
.steam path:nth-child(3) { animation-delay: 2s; }
@keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: .75; } 100% { opacity: 0; transform: translateY(-14px); } }

/* ===== Barra e selos de progresso ===== */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; }
.bar .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); margin-right: 8px; vertical-align: 1px; }
.seals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.sealbox { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .14em; color: var(--muted); }
.sealbox .stamp { display: block; width: 100%; max-width: 66px; aspect-ratio: 4 / 5; padding: 4px; box-sizing: border-box; background: radial-gradient(circle at 4px 4px, transparent 2.4px, #F3EBDF 2.9px) -4px -4px / 8px 8px; opacity: .45; }
.sealbox .art { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: #3A1418; }
.sealbox .art b { font-family: var(--display); font-style: italic; font-weight: 400; font-size: 22px; color: var(--gold-soft); }
.sealbox .stampimg { display: block; width: 100%; max-width: 66px; height: auto; transform: rotate(-4deg); filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); animation: stick .5s ease both; }
@keyframes stick { from { transform: rotate(-14deg) scale(1.35); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
.sealbox.today .stamp { opacity: .85; animation: glow 2.2s ease-in-out infinite; }
.sealbox.today { color: var(--gold-soft); }
@keyframes glow { 50% { transform: scale(1.06); } }
.bigstamp { width: 130px; height: auto; align-self: flex-start; transform: rotate(-4deg); filter: drop-shadow(0 10px 16px rgba(0,0,0,.5)); }

/* ===== A carta datilografada ===== */
.term { background: var(--paper-2) url(img/papel.jpg) 0 0 / 290px 200px; color: var(--ink); padding: 22px 20px 20px; position: relative; box-shadow: 0 20px 44px rgba(10,0,2,.55); }
.term::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--wine) 0 18px, transparent 18px 28px, var(--pine) 28px 46px, transparent 46px 56px); opacity: .85; }
.term .head { display: flex; justify-content: space-between; gap: 10px; font-size: 10px; font-weight: 600; letter-spacing: .22em; color: var(--wine); text-transform: uppercase; padding-bottom: 12px; border-bottom: 1.5px dashed #B8AE9F; margin-bottom: 14px; }
.lines { font-size: 14px; line-height: 1.65; min-height: 110px; white-space: pre-wrap; overflow-wrap: anywhere; }
.lines .hi { font-family: var(--hand); font-size: 24px; line-height: 1.4; color: var(--ink); }
.lines .p { color: var(--wine); font-weight: 600; }
.lines .q { font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.3; color: var(--ink); display: block; margin: 6px 0 2px; white-space: normal; text-wrap: balance; }
.lines .ok { color: #1E5A2E; font-weight: 600; }
.lines .err { color: var(--wine); }
.lines .dim { color: var(--ink-soft); }
.caret { display: inline-block; width: .6em; height: 1.1em; background: var(--ink); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.answer { display: flex; gap: 8px; margin-top: 14px; }
.answer label { position: absolute; left: -9999px; }
.answer input { flex: 1; min-width: 0; min-height: 50px; padding: 0 14px; background: #FFFDF8; color: var(--ink); border: 1.5px solid var(--ink); font-family: var(--mono); font-size: 16px; font-weight: 500; letter-spacing: .1em; }
.answer input::placeholder { color: #9A8E80; letter-spacing: .06em; }
.answer button { min-height: 50px; padding: 0 16px; border: 0; background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
.hintbtn { margin-top: 10px; background: none; border: 0; padding: 4px 0; color: var(--wine); font-family: var(--mono); font-size: 12px; text-decoration: underline; cursor: pointer; }
.term.shake { animation: tshake .4s ease; }
@keyframes tshake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

/* ===== Revelações ===== */
.reveal { display: flex; flex-direction: column; gap: 14px; animation: rise .6s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: .26em; color: var(--gold-soft); text-transform: uppercase; }
.reveal h2 { font-family: var(--display); font-weight: 400; font-style: italic; font-size: clamp(30px, 8.5vw, 40px); line-height: 1.08; margin: 0; text-wrap: balance; }
.reveal p { margin: 0; font-size: 14px; line-height: 1.6; }
.pic { display: block; width: 100%; height: auto; box-shadow: 0 18px 40px rgba(10,0,2,.55); }
.postal { background: var(--paper-2) url(img/papel.jpg) 0 0 / 290px 200px; padding: 10px 10px 0; transform: rotate(-1.5deg); box-shadow: 0 18px 40px rgba(10,0,2,.55); }
.postal img { display: block; width: 100%; height: auto; }
.postal .cap { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 4px; color: var(--ink); }
.postal .cap .h { font-family: var(--hand); font-size: 20px; }
.postal .cap .m { font-size: 9px; letter-spacing: .2em; color: var(--wine); text-transform: uppercase; white-space: nowrap; }
.lyric { background: var(--paper-2) url(img/papel.jpg) 0 0 / 290px 200px; color: var(--ink); padding: 22px 20px; font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1.5; white-space: pre-line; text-align: center; box-shadow: 0 18px 40px rgba(10,0,2,.55); }
.note { background: var(--paper-2) url(img/papel.jpg) 0 0 / 290px 200px; color: var(--ink); padding: 22px 20px; font-family: var(--display); font-size: 19px; line-height: 1.5; white-space: pre-line; box-shadow: 0 18px 40px rgba(10,0,2,.55); }
.note .hi { display: block; font-family: var(--hand); font-size: 26px; margin-bottom: 8px; }
.note .sign { display: block; margin-top: 14px; font-family: var(--hand); font-size: 22px; color: var(--wine); }
.free { background: rgba(20,2,4,.5); border: 1px solid var(--gold); padding: 18px; display: flex; flex-direction: column; gap: 12px; }

/* Vídeos (boas-vindas e escolha do dia 2) */
.welcome { display: flex; flex-direction: column; gap: 12px; }
.player { position: relative; width: 100%; max-width: 300px; aspect-ratio: 9 / 16; margin: 0 auto; background: #120204; overflow: hidden; box-shadow: 0 18px 40px rgba(10,0,2,.6); }
.player video { width: 100%; height: 100%; object-fit: cover; display: block; }
.player .bg { position: absolute; inset: 0; display: flex; filter: blur(12px) brightness(.5); transform: scale(1.15); }
.player .bg img { flex: 1; min-width: 0; object-fit: cover; }
.player .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
.player .ph .av { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; display: flex; border: 2px solid var(--gold-soft); }
.player .ph .av img { flex: 1; min-width: 0; object-fit: cover; }
.player .ph p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--paper); }
.player .ph .play { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--gold); color: var(--wall); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.player .tag { position: absolute; left: 12px; top: 12px; background: var(--paper); color: var(--ink); padding: 5px 10px; font-family: var(--hand); font-size: 18px; z-index: 2; box-shadow: 0 3px 8px rgba(0,0,0,.35); transform: rotate(-2deg); }
.player .bar2 { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--gold); width: 0; z-index: 2; }
.chooser { display: flex; flex-direction: column; gap: 14px; background: rgba(20,2,4,.45); border: 1px solid rgba(199,143,57,.5); padding: 18px 14px; }
.chooser .ask { font-family: var(--display); font-style: italic; font-size: 24px; line-height: 1.2; text-align: center; text-wrap: balance; margin: 0; }
.chooser .sub { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
.acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 10px; }
.act { width: calc(25% - 8px); min-width: 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0; color: var(--paper); cursor: pointer; font-family: var(--mono); }
.act .av { width: 66px; height: 66px; border-radius: 50%; overflow: hidden; display: flex; border: 2px solid rgba(199,143,57,.7); box-shadow: 0 6px 14px rgba(0,0,0,.4); transition: transform .2s ease, border-color .2s ease; }
.act .av img { flex: 1; min-width: 0; height: 100%; object-fit: cover; display: block; }
.act .av img + img { border-left: 2px solid var(--wall); }
.act .nm { font-size: 10px; line-height: 1.3; letter-spacing: .06em; text-align: center; }
.act:hover .av { transform: translateY(-2px); border-color: var(--gold-soft); }
.act[aria-pressed="true"] .av { border-color: var(--gold-soft); box-shadow: 0 0 0 3px rgba(226,182,106,.35); }
.act.locked { opacity: .35; cursor: not-allowed; }
.act.locked .av { filter: grayscale(1); }
.after .fine { text-align: center; }

.btn { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 54px; padding: 14px 20px; border: 0; cursor: pointer; text-decoration: none; font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; transition: transform .15s ease, background .2s ease; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--gold); color: var(--wall); }
.btn-primary:hover { background: var(--gold-soft); }
.btn-ghost { background: transparent; color: var(--paper); border: 1.5px solid rgba(237,227,212,.6); }
.fine { font-size: 12px; line-height: 1.6; color: var(--muted); margin: 0; }
.next { border-top: 1px solid rgba(199,143,57,.5); border-bottom: 1px solid rgba(199,143,57,.5); padding: 14px 0; display: flex; flex-direction: column; gap: 4px; }
.next .k { font-size: 10px; font-weight: 600; letter-spacing: .26em; color: var(--gold-soft); text-transform: uppercase; }
.next .v { font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1.25; }
.past summary { cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); padding: 10px 0; }
.past .inner { display: flex; flex-direction: column; gap: 22px; padding-top: 10px; }
.rename { align-self: center; background: none; border: 0; color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-decoration: underline; cursor: pointer; padding: 6px; }
.copyline input { width: 100%; box-sizing: border-box; min-height: 44px; background: rgba(20,2,4,.5); color: var(--paper); border: 1px solid rgba(237,227,212,.4); padding: 0 12px; font-family: var(--mono); font-size: 12px; }
.footer { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 10px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
.footer .chip { background: var(--paper); padding: 6px 10px; display: flex; }
.footer .chip img { width: 44px; height: auto; display: block; }
.testbar { background: var(--paper); color: var(--ink); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; }
.testbar button { font-family: var(--mono); font-size: 11px; padding: 6px 8px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.testbar button[aria-pressed="true"] { background: var(--wine); color: var(--paper); border-color: var(--wine); }
.enter:focus-visible, .answer input:focus-visible, .answer button:focus-visible, .btn:focus-visible, .hintbtn:focus-visible, .testbar button:focus-visible, .past summary:focus-visible, .rename:focus-visible, .act:focus-visible, .play:focus-visible { outline: 3px solid var(--gold-soft); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  .caret, .sealbox.today .stamp, .sealbox .stampimg, .reveal, .term.shake, .steam path, .home { animation: none; }
  .steam path { opacity: .6; }
  .door { transition: none; }
  .intro.open .house { animation: none; }
  .intro { transition: opacity .3s ease; }
}
</style>

</head>
<body>
<!-- ENTRADA: a porta -->
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-t">
  <div class="kick">Você é bem-vindo(a)</div>
  <h1 id="intro-t">A nossa casa está de portas abertas para você e sua família.</h1>
  <div class="house" aria-hidden="true">
    <div class="glow"></div>
    <div class="door">
      <div class="panel p1"></div><div class="panel p2"></div>
      <svg class="wreath" viewBox="0 0 100 110" aria-hidden="true">
        <circle cx="50" cy="50" r="34" fill="none" stroke="#1F4A2A" stroke-width="16"></circle>
        <circle cx="50" cy="50" r="34" fill="none" stroke="#2E6A3C" stroke-width="7" stroke-dasharray="4 5"></circle>
        <circle cx="30" cy="30" r="3.4" fill="#C8202E"></circle><circle cx="72" cy="34" r="3.4" fill="#C8202E"></circle><circle cx="22" cy="58" r="3.4" fill="#C8202E"></circle><circle cx="78" cy="62" r="3.4" fill="#C8202E"></circle><circle cx="58" cy="82" r="3.4" fill="#C8202E"></circle>

function norm(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim(); }
function key(w) { try { return btoa(w.split('').reverse().join('')); } catch (e) { return ''; } }
function matches(input, k) { var words = norm(input).split(' '); var all = norm(input).replace(/ /g, ''); return words.some(function (w) { return key(w) === k; }) || key(all) === k; }
function cleanName(s) { return (s || '').replace(/[^\p{L}\p{M}' -]/gu, '').trim().split(' ')[0].slice(0, 20); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ===== Vídeos ===== */
function faces(list) { return list.map(function (f) { return '<img src="img/a/' + f + '.jpg" alt="">'; }).join(''); }
function buildPlayer(opts) {
  var p = document.createElement('div'); p.className = 'player';

function buildChooser() {

      if (navigator.share) navigator.share({ title: 'Uma carta de Natal', text: 'Tem uma carta de Natal para você:', url: CONFIG.siteUrl }).catch(copy); else copy();
    });
    r.appendChild(sh); r.appendChild(cl); r.appendChild(msg);
    $('reveal-slot').appendChild(r);
    return;
  }
  if (idx < 0) {
    $('bar-right').textContent = 'Abre 13/11';
    type([{ t: 'Querido(a) ' + nome + ',', c: 'hi' }, { t: 'esta carta só pode ser lida com 4 selos.', c: 'dim' }, { t: 'o primeiro selo chega em 13/11, à meia-noite.', c: 'p' }]);
    return;
  }
  $('bar-right').textContent = 'Selo ' + (idx + 1) + ' de 4';
  if (solved(idx)) { showSolved(idx, false); return; }
  var d = DAYS[idx];
  var intro = idx === 0
    ? [{ t: 'Querido(a) ' + nome + ',', c: 'hi' }, { t: 'que bom ter você aqui em casa.', c: 'dim' }, { t: 'esta carta é para você, mas para ler, ela precisa de 4 selos.', c: 'dim' }, { t: 'um selo por dia, até o dia 17.', c: 'dim' }, { t: 'para ganhar o selo de hoje, responda:', c: 'p' }]
    : [{ t: 'Querido(a) ' + nome + ',', c: 'hi' }, { t: idx + ' de 4 selos colados nesta carta.', c: 'ok' }, { t: 'para ganhar o selo de hoje, responda:', c: 'p' }];
  intro.push({ t: d.q, c: 'q' });
  type(intro, function () { $('answer').hidden = false; $('ans').value = ''; });
}
function showSolved(idx, fresh) {
  var lines = [{ t: 'selo ' + (idx + 1) + ' colado na sua carta.', c: 'ok' }, { t: (idx + 1) + ' de 4 selos.', c: 'ok' }];
  if (DAYS[idx + 1]) lines.push({ t: 'o próximo selo chega em ' + DAYS[idx + 1].label + ', à meia-noite.', c: 'p' });
  else lines.push({ t: 'à meia-noite, a carta pode ser lida.', c: 'p' });
  type(lines);
  renderSeals(idx);
  var slot = $('reveal-slot'); slot.textContent = '';
  slot.appendChild(revealNode(DAYS[idx].reveal));
  slot.appendChild(ctaNode());
  if (fresh && !reduce) setTimeout(function () { slot.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 900);
}

$('nameform').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = cleanName($('nm-in').value);
  if (!v) { $('nm-in').focus(); return; }
  nome = v; store('vj-nome', v); showHome();
});
$('rename').addEventListener('click', function () { nome = ''; store('vj-nome', ''); try { localStorage.removeItem('vj-visitou'); } catch (e) {} homeReady = false; showHome(); });
$('answer').addEventListener('submit', function (e) {
  e.preventDefault();
  var idx = todayIndex(); if (idx < 0) return;
  var v = $('ans').value;
  if (!norm(v)) { $('ans').focus(); return; }
  if (matches(v, DAYS[idx].k)) {
    store('vj-porta-' + DAYS[idx].d, '1');
    $('answer').hidden = true; $('hintbtn').hidden = true;
    if (navigator.vibrate) { try { navigator.vibrate([30, 40, 60]); } catch (er) {} }
    showSolved(idx, true);
  } else {
    wrong++;
    var t = $('term'); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
    var line = document.createElement('span'); line.className = 'err'; line.textContent = '\n“' + v.trim() + '” não é a resposta. tente de novo.';
    $('lines').insertBefore(line, $('lines').querySelector('.caret'));
    if (wrong >= 2) $('hintbtn').hidden = false;
    $('ans').select();
  }
});
$('hintbtn').addEventListener('click', function () {
  var idx = todayIndex();
  var line = document.createElement('span'); line.className = 'dim'; line.textContent = '\ndica: ' + DAYS[idx].hint;
  $('lines').insertBefore(line, $('lines').querySelector('.caret'));
  $('hintbtn').hidden = true; $('ans').focus();
});

function renderTestbar() {
  if (!testMode) return;
  $('testbar').hidden = false;
  var box = $('testdays'); box.textContent = '';
  DAYS.map(function (d) { return [d.d, d.label]; }).concat([['2026-11-17', '17/11']]).forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = p[1];
    b.setAttribute('aria-pressed', String(today() === p[0]));
    b.addEventListener('click', function () { overrideDate = p[0]; render(); renderTestbar(); });
    box.appendChild(b);
  });
  var z = document.createElement('button'); z.type = 'button'; z.textContent = 'Zerar';
  z.addEventListener('click', function () { DAYS.forEach(function (d) { try { localStorage.removeItem('vj-porta-' + d.d); } catch (e) {} }); try { ['vj-escolha', 'vj-outros', 'vj-nome', 'vj-visitou'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} nome = cleanName(params.get('nome')); homeReady = false; showHome(); });
  box.appendChild(z);
}
renderTestbar();
</script>
